name: Restyle editor icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restyle-icons.yml

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace icon set
        run: |
          python <<'PY'
          from pathlib import Path

          icons = r'''const createIcon = (content) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${content}</svg>`;

          const ICON_HEADING_MENU = createIcon(`<path d="M4 5v14M11 5v14M4 12h7"/><path d="m16 10 3 3 3-3"/>`);
          const ICON_HEADING = createIcon(`<path d="M4 5v14M11 5v14M4 12h7"/><path d="M17 8h2v9M16 17h5"/>`);
          const ICON_BOLD = createIcon(`<path d="M7 4h6a4 4 0 0 1 0 8H7z"/><path d="M7 12h7a4 4 0 0 1 0 8H7z"/>`);
          const ICON_ITALIC = createIcon(`<path d="M10 4h9M5 20h9M15 4 9 20"/>`);
          const ICON_STRIKETHROUGH = createIcon(`<path d="M16 5.5A5 5 0 0 0 12.5 4H10a4 4 0 0 0-3.8 5.25"/><path d="M8 15a4 4 0 0 0 4 5h2a4 4 0 0 0 3.85-5"/><path d="M4 12h16"/>`);
          const ICON_LINK = createIcon(`<path d="m10 13.5-1.5 1.5a4 4 0 0 1-5.7-5.6l3-3a4 4 0 0 1 5.7 0"/><path d="m14 10.5 1.5-1.5a4 4 0 0 1 5.7 5.6l-3 3a4 4 0 0 1-5.7 0"/><path d="m8.5 15.5 7-7"/>`);
          const ICON_UL = createIcon(`<circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M8 6h12M8 12h12M8 18h12"/>`);
          const ICON_OL = createIcon(`<path d="M3.5 5.5h1V9M3.5 9h2"/><path d="M3.5 12.5a1.25 1.25 0 1 1 2 1l-2 2h2"/><path d="M3.5 18h1.25a1 1 0 1 1 0 2H3.5M8 6h12M8 13h12M8 19h12"/>`);
          const ICON_OUTDENT = createIcon(`<path d="M10 6h10M10 12h10M10 18h10"/><path d="m7 9-3 3 3 3M4 12h5"/>`);
          const ICON_INDENT = createIcon(`<path d="M4 6h10M4 12h10M4 18h10"/><path d="m17 9 3 3-3 3M15 12h5"/>`);
          const ICON_BLOCKQUOTE = createIcon(`<path d="M9 6H5a2 2 0 0 0-2 2v4h6v2a4 4 0 0 1-4 4"/><path d="M21 6h-4a2 2 0 0 0-2 2v4h6v2a4 4 0 0 1-4 4"/>`);
          const ICON_HR = createIcon(`<path d="M4 12h16"/><path d="m7 9-3 3 3 3M17 9l3 3-3 3"/>`);
          const ICON_TABLE = createIcon(`<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/>`);
          const ICON_CODEBLOCK = createIcon(`<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m9 9-3 3 3 3M15 9l3 3-3 3"/>`);
          const ICON_INLINECODE = createIcon(`<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>`);
          const ICON_IMAGE = createIcon(`<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 5"/>`);
          const ICON_TABLE_INSERT_ROW_ABOVE = createIcon(`<rect x="4" y="9" width="16" height="10" rx="1"/><path d="M4 14h16M9 9v10M15 9v10M12 7V3M9.5 5.5 12 3l2.5 2.5"/>`);
          const ICON_TABLE_INSERT_ROW_BELOW = createIcon(`<rect x="4" y="5" width="16" height="10" rx="1"/><path d="M4 10h16M9 5v10M15 5v10M12 17v4M9.5 18.5 12 21l2.5-2.5"/>`);
          const ICON_TABLE_INSERT_COL_LEFT = createIcon(`<rect x="9" y="4" width="10" height="16" rx="1"/><path d="M14 4v16M9 9h10M9 15h10M7 12H3M5.5 9.5 3 12l2.5 2.5"/>`);
          const ICON_TABLE_INSERT_COL_RIGHT = createIcon(`<rect x="5" y="4" width="10" height="16" rx="1"/><path d="M10 4v16M5 9h10M5 15h10M17 12h4M18.5 9.5 21 12l-2.5 2.5"/>`);'''

          marker = 'class MarkdownWYSIWYG {'

          editor_path = Path('dist/editor.js')
          editor = editor_path.read_text(encoding='utf-8')
          if marker not in editor:
              raise SystemExit('class marker not found in dist/editor.js')
          editor = icons + '\n\n' + marker + editor.split(marker, 1)[1]
          editor_path.write_text(editor, encoding='utf-8')

          esm_path = Path('dist/editor.esm.js')
          esm = esm_path.read_text(encoding='utf-8')
          if marker not in esm:
              raise SystemExit('class marker not found in dist/editor.esm.js')
          esm = "import { marked } from 'marked';\n\n" + icons + '\n\n' + marker + esm.split(marker, 1)[1]
          esm_path.write_text(esm, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check dist/editor.js
          node --check dist/editor.esm.js
          grep -q "const createIcon" dist/editor.js
          grep -q "stroke=\"currentColor\"" dist/editor.js
          if grep -Eq '#4a90e2|#999|font-family=' dist/editor.js; then
            echo 'Legacy icon styling remains'
            exit 1
          fi

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restyle-icons.yml
          git add dist/editor.js dist/editor.esm.js
          git commit -m "style: redesign editor icon set"
          git push origin HEAD:main
